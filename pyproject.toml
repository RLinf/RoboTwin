[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rlinf-robotwin-runtime"
version = "0.1.0"
description = "Installable RoboTwin runtime and dependency contract maintained for RLinf"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11,<3.12"
authors = [{name = "RLinf Contributors"}]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: GPU :: NVIDIA CUDA :: 12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
]
# NOTE: ``curobo`` is a runtime requirement for the CuroboPlanner backend but
# is intentionally NOT listed in ``dependencies``: its build contract cannot be
# expressed in package metadata (Round 2 / Phase 5). It is installed instead by
# the ``robotwin-install-curobo`` console script (see ``[project.scripts]``
# below), which owns the exact upstream commit + build flags. Run it after the
# ``[robotwin]`` extra: ``robotwin-install-curobo``.
#
# Two build-time facts block a plain ``"curobo @ git+..."`` dependency:
#  1. ``--no-build-isolation`` is required. cuRobo's ``[build-system]
#     requires`` lists ``torch`` (unpinned); under uv's default build isolation
#     the backend fetches a fresh CPU/wrong-CUDA torch and compiles the CUDA
#     extensions against it (ABI mismatch at runtime). ``--no-build-isolation``
#     makes the build reuse the installed ``torch==2.7.1+cu128``. This is a uv
#     install flag, not a package-metadata field.
#  2. ``setuptools_scm`` version detection. cuRobo versions itself with
#     ``[tool.setuptools_scm]``; uv's git fetch for a ``git+...@<sha>`` dep
#     fetches only the commit ref (no tag history), so the version is
#     underivable and the build fails. The workaround is
#     ``SETUPTOOLS_SCM_PRETEND_VERSION=0.7.0`` in the build env -- again an
#     environment setting with no pyproject equivalent.
# Both are build-environment settings with no dependency-declaration form, so
# cuRobo is a post-install step owned by the entrypoint rather than a dep.
# ``robotwin.envs.robot.planner`` imports ``curobo`` behind a ``try/except``,
# so the robotwin wheel imports cleanly without curobo present; curobo is only
# needed when ``CuroboPlanner`` is instantiated.
#
# ``--no-deps`` is also used, but the Phase 5 resolver re-check CORRECTED the
# old rationale: cuRobo pins ``scipy>=1.7.0`` / ``torch>=1.10``, both satisfied
# by the runtime pins ``scipy==1.10.1`` / ``torch==2.7.1``. A dry-run of
# cuRobo's full dep set against the runtime pins holds scipy at 1.10.1 (69
# packages, no conflict) -- so ``--no-deps`` is NOT needed to avoid a scipy
# upgrade (that was never the real risk). It is retained for leanness only:
# cuRobo's extra deps (numpy-quaternion, scikit-image, networkx, ...) are not
# imported by the planner path (Round 1 parity with --no-deps proved this).
# See ``robotwin/curobo_install.py`` and ``script/_install.sh``.
dependencies = [
    "gymnasium==0.29.1",
    "huggingface-hub>=0.27.1",
    "imageio==2.34.2",
    "matplotlib",
    # mplib stays a runtime dep: robotwin/envs/robot/planner.py does a top-level
    # ``import mplib`` (reached via _base_task -> Robot -> from .planner import),
    # so it is a hard import-time dep; and MplibPlanner (the TOPP post-processor)
    # is constructed on the default task path (_base_task hardcodes need_topp=True).
    # Only MplibWrapperPlanner (planner_backend=="mplib") is unused -- env_server
    # hardcodes planner_backend="curobo". See script/_install.sh (Phase 4).
    "mplib==0.2.1; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "numpy==1.26.4",
    # Non-headless (not opencv-python-headless): sapien==3.0.0b1 transitively
    # requires ``opencv-python>=4.0`` (non-headless), so declaring headless
    # here would install BOTH variants, recreating the cv2/ directory duality
    # (the two wheels share cv2/ and overwrite each other's files). Pinning
    # the full ``opencv-python==4.9.0.80`` satisfies sapien's requirement as a
    # single install — the headless optimization is unreachable while sapien
    # forces the full variant. cv2 is not imported on the inference path
    # (Phase 6 import trace), so the GUI components are unused but harmless.
    "opencv-python==4.9.0.80",
    "open3d==0.18.0; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "pillow>=10",
    "pyyaml",
    "sapien==3.0.0b1; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "scipy==1.10.1",
    "setuptools>=69.5.1,<75.9",
    "torch==2.7.1",
    "toppra==0.6.3",
    "transforms3d==0.4.2",
    "trimesh==4.4.3",
    "warp-lang==1.11.1; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "yourdfpy>=0.0.53",
]

[project.scripts]
robotwin-download-assets = "robotwin.assets:main"
# Owned installer for the pinned cuRobo @ d64c4b (build contract cannot be a
# normal dep -- see NOTE above). Runs
# ``uv pip install --no-build-isolation --no-deps curobo@d64c4b`` with
# SETUPTOOLS_SCM_PRETEND_VERSION=0.7.0. Run after ``uv pip install -e ".[robotwin]"``.
robotwin-install-curobo = "robotwin.curobo_install:main"

[project.urls]
Homepage = "https://github.com/RoboTwin-Platform/RoboTwin"
Repository = "https://github.com/RoboTwin-Platform/RoboTwin"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["robotwin*"]
exclude = ["script*", "description*", "task_config*", "tests*"]

[tool.setuptools.package-data]
robotwin = [
    "configs/task/*.yml",
    "description/task_instruction/*.json",
    "description/objects_description/**/*.json",
]

[tool.ruff]
line-length = 100
target-version = "py311"
