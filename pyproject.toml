[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rlinf-robotwin-runtime"
version = "0.1.0"
description = "Installable RoboTwin runtime and dependency contract maintained for RLinf"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.12"
authors = [{name = "RLinf Contributors"}]
maintainers = [{name = "RLinf Team"}]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: GPU :: NVIDIA CUDA :: 12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
# cuRobo is an optional planner dependency (``robotwin/envs/robot/planner.py``
# imports it behind a try/except that falls back to ``CuroboPlanner = None``).
# The public RoboTwin runtime wheel does NOT declare cuRobo — public-index
# distributions should not carry direct-URL source dependencies. cuRobo's
# source ownership lives entirely in the integrator: RPent's ``[robotwin]``
# extra pins ``nvidia-curobo @ git+https://github.com/NVlabs/curobo.git@v0.7.8``
# and supplies the build-time Torch override via
# ``[tool.uv.extra-build-dependencies]``, so a plain
# ``uv pip install -e ".[robotwin]"`` builds it with no post-install step.
dependencies = [
    "gymnasium==0.29.1",
    "huggingface-hub>=0.27.1",
    "imageio>=2.36.1,<3",
    "matplotlib",
    # mplib stays a runtime dep: robotwin/envs/robot/planner.py does a top-level
    # ``import mplib`` (reached via _base_task -> Robot -> from .planner import),
    # so it is a hard import-time dep; and MplibPlanner (the TOPP post-processor)
    # is constructed on the default task path (_base_task hardcodes need_topp=True).
    # Only MplibWrapperPlanner (planner_backend=="mplib") is unused -- env_server
    # hardcodes planner_backend="curobo". See script/_install.sh (Phase 4).
    "mplib==0.2.1; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "numpy==1.26.4",
    # Non-headless (not opencv-python-headless): sapien==3.0.0b1 transitively
    # requires ``opencv-python>=4.0`` (non-headless), so declaring headless
    # here would install BOTH variants, recreating the cv2/ directory duality
    # (the two wheels share cv2/ and overwrite each other's files). Using the
    # full ``opencv-python>=4.10.0.84,<5`` satisfies sapien's requirement as a
    # single install — the headless optimization is unreachable while sapien
    # forces the full variant. cv2 is not imported on the inference path
    # (Phase 6 import trace), so the GUI components are unused but harmless.
    # Round 3 raised the floor to 4.10.0.84 to align with OpenPI
    # (``opencv-python>=4.10.0.84``) and RLDX-rpent's 4.11 line. Note a
    # residual structural conflict remains vs RLDX-rpent, which pins the
    # *different distribution* ``opencv-contrib-python-headless``: both
    # provide ``cv2/`` and collide in a shared venv. That is documented in
    # the Round 3 pairwise report (Gate 5); it cannot be fixed from this
    # side while SAPIEN forces the non-headless variant.
    "opencv-python>=4.10.0.84,<5",
    "open3d==0.18.0; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "pillow>=10",
    "pyyaml",
    "sapien==3.0.0b1; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "scipy>=1.15.3,<2",
    "setuptools>=69.5.1,<75.9",
    "torch==2.7.1",
    "toppra==0.6.3",
    "transforms3d==0.4.2",
    "trimesh==4.4.3",
    "warp-lang==1.11.1; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "yourdfpy>=0.0.53",
]

[project.scripts]
robotwin-download-assets = "robotwin.assets:main"

[project.urls]
Homepage = "https://github.com/RLinf/RoboTwin"
Repository = "https://github.com/RLinf/RoboTwin"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["robotwin*"]
exclude = ["script*", "description*", "task_config*", "tests*"]

[tool.setuptools.package-data]
robotwin = [
    "configs/task/*.yml",
    "description/task_instruction/*.json",
    "description/objects_description/**/*.json",
]

[tool.ruff]
line-length = 100
target-version = "py310"
